webhook_event_contract:
  endpoint_not_registered_in_this_lane: true
  content_type: 'application/json'
  headers:
    signature: 'x-highlevel-signature or x-ghl-signature'
    timestamp: 'x-highlevel-timestamp or x-ghl-timestamp'
    event_id: 'x-highlevel-event-id or x-ghl-event-id'
  allowed_events:
    - 'subscription.active'
    - 'payment.succeeded'
    - 'payment.failed'
    - 'payment.recovered'
    - 'subscription.canceled'
    - 'refund.full'
    - 'chargeback'
  payload_shape:
    provider_event_id: 'required stable provider event ID'
    event_type: 'required allowlisted event'
    location_id: 'required HighLevel location ID'
    contact_id: 'optional HighLevel contact ID'
    subscription_id: 'optional HighLevel subscription ID'
    transaction_id: 'optional HighLevel transaction ID'
    opportunity_id: 'optional HighLevel opportunity ID'
    occurred_at: 'required ISO timestamp'
    current_period_end: 'optional ISO timestamp'
    amount_ref: 'optional redacted amount reference'
