name: OT-37 PostgreSQL Assurance

on:
  pull_request:
  push:
    branches:
      - codex/ot37-postgres-assurance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ot37-postgres-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-assurance:
    name: PostgreSQL 16 assurance harness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run OT-37 PostgreSQL assurance
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
          OT37_OUTPUT_DIR: ops/evidence/ot-37
        run: npx tsx scripts/postgres-assurance/run.ts

      - name: Secret scan
        run: npm run secret:scan

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Upload sanitized OT-37 summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ot37-postgres-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ops/evidence/ot-37/latest-postgres-assurance-report.json
            ops/evidence/ot-37/latest-postgres-assurance-report.md
          if-no-files-found: ignore
          retention-days: 7
