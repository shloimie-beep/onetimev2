name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/foundation-landing-lead-v1
      - codex/crm-core-v1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Secret scan
        run: npm run secret:scan

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run unit

      - name: Integration tests
        run: npm run integration

      - name: Build
        run: npm run build

      - name: Playwright e2e
        run: npm run e2e

      - name: Playwright Parent credential validation over loopback TLS
        run: npx playwright test -c tests/e2e/parent-student-credentials.playwright.config.ts

      - name: Playwright accessibility
        run: npm run accessibility

      - name: Playwright performance and bundle gates
        run: npm run performance

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
