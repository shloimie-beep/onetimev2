name: A11 Read-only Migration Verification

on:
  pull_request:
    paths:
      - '.github/workflows/a11-migration-verification.yml'
      - 'package.json'
      - 'packages/db/src/index.ts'
      - 'packages/db/migrations/**'
      - 'scripts/migrate.ts'
      - 'scripts/verify-migrations.ts'
      - 'tests/db-verification/**'
      - 'tests/unit/db/migration-verification.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a11-migration-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-verification:
    name: PostgreSQL 16 read-only verifier proof
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit verifier proof
        run: npx vitest run --config vitest.unit.config.ts tests/unit/db/migration-verification.test.ts

      - name: Run disposable PostgreSQL proof
        env:
          A11_ALLOW_DISPOSABLE_POSTGRES_WRITE: 'true'
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npx tsx tests/db-verification/real-postgres.ts

      - name: Upload sanitized proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11-migration-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/evidence/a11/READ-ONLY-MIGRATION-VERIFICATION.json
          if-no-files-found: ignore
          retention-days: 7
