schema_version: 1
goal_id: OT-LAUNCH-01
decisions:
  - id: canonical-status
    decision: BOARD.yaml is the only current status map; reports link to it rather than copying mutable status or SHAs.
  - id: preview-boundary
    decision: Experience Preview is an explicit isolated_staging/test capability with an independent enable flag and production fail-closed checks.
  - id: no-impersonation
    decision: Role cards render server-produced read-only data; only the three fictional Students may open short-lived preview sessions in separate tabs.
  - id: scenario
    decision: The Cohen family and Berachos 2:1 learning unit replace random fixture narratives on persistent staging.
  - id: provider-truth
    decision: A provider remains off until exact terminal evidence proves activation; independent tracks continue meanwhile.
  - id: ghl-authority
    decision: Agent Mode mutates GHL and returns sanitized readback; Codex alone updates canonical Git state.
  - id: ghl-github-control
    decision: GitHub workflow-registry.yaml is the single editable HighLevel automation inventory; current.json and workflows.yaml are source-hashed generated projections, the human report is generated, observed GHL is evidence rather than authority, and MISSING/DRAFT_SHELL/DRAFT_WAITING_EXTERNAL/SAVED_REOPENED/ACTIVE_CONFIGURED/ACTIVE_TESTED/DRIFTED/BLOCKED are the only workflow control states.
  - id: ghl-closed-loop
    decision: A reviewed Git job may close only through browser apply, save, navigate/reload, reopen/readback, bounded authorized canary, sanitized committed result, and drift validation; unknown workflows fail closed and may enter 99 - Deprecated only after dependency checking and separate safe authorization, never silent deletion.
  - id: visual-execution-loop
    decision: Visual intent is converted into route/breakpoint acceptance, inspected against current screenshots/page state, automatically repaired when the violation is obvious and in scope, retested, and verified at the deployed URL; the operator is asked only for a genuine product decision.
  - id: assignment-authority
    decision: The persistent-staging conductor assigns tracks before dispatch; non-conductors verify assignment and write only their handoff, never BOARD.yaml.
  - id: ghl-dispatcher
    decision: One canonical outbox-backed One Time to GHL dispatcher owns app events/tags/bot invocations; workflow shells stay DRAFT_WAITING_EXTERNAL on the exact app/adapter contract until producers pass.
  - id: migration-prefix
    decision: 'Preserve PR #104 migration 2214_learning_delivery_content_factory and use 2215_experience_preview_sessions for Experience Preview.'
  - id: migration-history
    decision: Live 2209/2210 duplicate-prefix ledger rows are legitimate immutable history; 2216 is reserved for new schema, and a required HighLevel 2205 must be integrated exact and unchanged.
  - id: status-semantics
    decision: Pending tests, deployment, reseed, or convergence are remaining_work/pending verification; blocked is reserved for an actual impasse.
  - id: ghl-asset-kinds
    decision: OT-C01 names two distinct live Draft/unsent assets and they are never collapsed. Workflow wrapper f28d8b8a-c26a-4a4f-a9f2-d2a8e94af1ae is under One Time / 45 - Events / 2026 / Tisha B'Av 2026; campaign 6a5f750b557817806a14b19e is under Marketing / Email Campaigns / Home with zero recipients/sends. OT-A1 and knowledge bases are non-workflow assets and never inflate workflow counts.
  - id: ghl-visible-closeout-fail-closed-20260722
    decision: 'PR #107 closeout c9f7794 remains authoritative for exhaustive visible inventory truth, while terminal PR #107 head 1e247c70004dffb6247fc1ee407f1153d753bd7d is authoritative for the later OT-E01 Email A save/reopen and failed fresh-signup handoff readback. Seventeen non-Tisha canonical workflows are DRAFT_SHELL with empty trigger/action canvases; OT-E01 alone retains the historical controlled GHL-only ACTIVE_TESTED canary, but current application registration end to end is blocked because the new signup produced no exact tag or enrollment. The same-name OT-C01 wrapper and legacy KB remain visible drift, OT-A1 current visibility is unverified, and absent archived/hidden-AI UI coverage must never be inferred empty or used to authorize quarantine/deletion.'
  - id: tisha-production-registration-handoff-failure-20260722
    decision: "The operator's newest production Tisha signup produced an account/login-code email but no exact registered-event tag, OT-E01 enrollment, or event confirmation. No manual tag/enrollment, substitute/fallback email, duplicate signup, customer test, or WhatsApp action is permitted. Queued OT-TISHA-HANDOFF-01 on release/tisha-bav-2026-live owns only the application server registration/tag/enrollment/fallback repair and narrow production hotfix; after proof it must reprocess the one affected existing operator contact exactly once and prove no duplicate enrollment/delivery. PR #110 remains visual-only and PR #107 remains the sole GHL UI writer."
  - id: provider-approval-gates
    decision: Enrollment, publication/activation, broad sends, payments, production change, quarantine/deprecation, and destructive action each require separate exact authority; no gate implies another.
  - id: zoom-config-contract
    decision: Meeting SDK uses canonical ZOOM_MEETING_SDK_CLIENT_ID/CLIENT_SECRET/WEB_VERSION with KEY/SECRET temporary aliases only; S2S OAuth uses separate ZOOM_S2S_ACCOUNT_ID/CLIENT_ID/CLIENT_SECRET with ZOOM_ACCOUNT_ID as a temporary account-ID alias, and ZOOM_UI_PREVIEW never implies ZOOM_REAL_CONTROL.
  - id: queued-video-to-classroom
    decision: 'VIDEO-TO-CLASSROOM-E2E is implemented and accepted from PR #113 head 45b213a5ddfde97d60f220ae3eb0bdff5cda51ed, and the bounded real-media CONTENT-002 canary is terminal from PR #117 head 13656a558b44d6af533720697e4e9eb12d22bf9e. One exact private source completed transcription, private Vimeo upload, captions, occurrence-scoped review, protected entitled-Student playback, sibling denial, and final unpublish without retry or customer/production action. The private asset/captions and approved-unpublished item are retained; this proof grants no repeat provider run or broader publication authority.'
  - id: tisha-ot-c01-email-invitation-20260722
    decision: Historical authorization named f28d8b8a-c26a-4a4f-a9f2-d2a8e94af1ae, which terminal readback later proved is the Draft workflow wrapper rather than the separate Email Marketing campaign 6a5f750b557817806a14b19e. No send occurred. This decision is fully superseded by tisha-event-permission-supersedes-ot-c01-send-20260722 and grants no current mutation, audience, schedule, or send authority to either asset.
  - id: tisha-ot-e01-registered-direct-class-link-exception-20260722
    decision: The newest direct operator instruction permits the protected direct class link already supplied to the sole GHL executor only in exact OT-E01 registered-contact email delivery tonight, limited to the immediate confirmation and/or one-hour/ten-minute reminders for contacts enrolled through the canonical registration trigger and still email-eligible. OT-C01 keeps only https://join.onetimeonetime.com/tisha-bav; no WhatsApp is permitted. Exact OT-E01 ID, idempotent registration, late-skip timing, in-flight enrollment behavior, save/reload/reopen readback, and all eligibility gates must remain. Git, BOARD, logs, screenshots, browser proof, final reports, and public/customer pages may record only protected direct class link present/valid and must never contain the URL. Every unrelated provider-link restriction remains in force.
  - id: tisha-event-permission-supersedes-ot-c01-send-20260722
    supersedes: tisha-ot-c01-email-invitation-20260722
    decision: 'The newer event-permission instruction withdraws OT-C01 send authority. There is no newsletter checkbox; the exact registration disclosure is “By reserving, you’ll receive emails about this event.” Registration grants only scoped Tisha event-email permission and never newsletter/general-marketing consent. DND, suppression, unsubscribe, complaint, and hard bounce always win. OT-E01 uses the exact event-registration permission/marker rather than newsletter/global Email Opt-In, while its repaired direct-class-link exception remains sanitized. OT-C01 stays Draft, unseeded, unscheduled, and at zero sends; its invitation audience is read-only evidence classification only, 207 email-capable contacts are not opted in, and only synthetic/operator-owned verification with zero customer email is permitted. A separate governed coding task owns durable permission/schema/classification outside PR #108 and this conductor pass.'
  - id: event-service-email-authority-and-deny-precedence-20260722
    decision: Application DB is authoritative for append-only account/product/event/contact-scoped event_service_email permission history and current projection; GHL fields/tags are projections only and no existing contact receives inferred/backfilled permission. Registration atomically and idempotently grants only the fixed disclosed Tisha event scope, queues projection, records disclosure version/source/timestamps, never grants marketing consent, and cannot override withdrawal/suppression. Typed deny precedence is complaint/hard bounce, global suppression/DND, global unsubscribe, event withdrawal/cancellation, invalid/ambiguous identity, then missing active event permission. OT-E01 requires matching registration plus active event permission and rechecks at send time; OT-C01 remains Draft/unseeded/unscheduled/unsent. The separate coding lane uses the next globally free forward-only migration after convergence without assuming a number, synthetic/operator-owned tests only, and zero GHL/customer/WhatsApp mutation in this conductor pass.
  - id: portal-focused-workspace-20260723
    decision: Parent and Student are focused full-screen application workspaces. Desktop uses a left category menu, contextual top controls, a compact upper summary grid, and one large lower focused panel; tablet/mobile keeps categories discoverable without horizontal page overflow. Selecting a category replaces the focused content body rather than displaying every dashboard section simultaneously, while existing entitlement, sibling-isolation, private-data, and provider-off boundaries remain unchanged.
  - id: provider-canaries-authorized-20260723
    supersedes: zoom-real-control-operator-change-set-not-authorized
    decision: The operator authorizes the previously defined staging-only Zoom configuration/human canary, the disposable BNA preview database plus private synthetic Telegram-to-GHL-draft canary, and one bounded operator-owned media canary. Protected values must remain outside Git/logs/screenshots/reports; this authority never permits customer or broad messages, GHL UI changes outside the sole executor, production provider activation, payments, or destructive cleanup. Executors continue safe independent work until an exact provider, technical, or external barrier is reached.
  - id: phased-production-rollout-20260723
    decision: One Time may move toward production through independently accepted slices rather than a single all-or-nothing launch. Each slice must first pass exact-head staging health, focused automated tests, desktop/mobile browser proof, scope and rollback review, and live-route verification after promotion. Approval is limited to that verified slice and never implies unrelated provider activation, customer sends, payment changes, DNS changes, or destructive actions.
  - id: ghl-payment-history-one-time-access-state-20260723
    decision: GHL is the sole business system of record for payment transactions, invoices, subscription history, refunds, and payment operations. One Time stores only the account/product access state and the minimum effective-at, expires-at, source-reference, and revocation-reason projection required to authorize the application; it never fabricates or duplicates a payment ledger. A controlled free pilot may grant access through an explicit free-pilot entitlement without a payment transaction.
  - id: controlled-free-production-pilot-authorized-20260723
    decision: The operator authorizes preparation and separately governed promotion of a controlled free production pilot for operator-owned Admin, Parent, and Student use. Promotion still requires one immutable release candidate, staging role and playback proof, backup/rollback evidence, exact production scope, and live readback. This does not authorize broad customer messaging, inferred consent, destructive cleanup, or an unreviewed provider rollout.
  - id: public-lead-bot-boundary-20260723
    decision: Remove the current landing-page WhatsApp/offline-readiness helper. The future public lead-capture assistant belongs to the canonical GHL website-chat/conversation path and may create a lead only under its reviewed consent and dedupe contract. Telegram remains Rabbi Eli Scheller's private Torah-question and content interface; only an explicitly classified substantive Torah question may be routed there, and ordinary sales, login, billing, or support chat never forwards to Telegram.
  - id: board-derived-operator-launch-summary-20260723
    decision: The Admin launch summary is generated from BOARD.yaml and its acceptance IDs. It shows the active milestone percentage, completed and pending capabilities, exact blockers, safe role/route links, the latest sanitized change summary, and one next executable task. Neither the UI projection nor any report is editable status or a second canonical model.
  - id: provider-canaries-reaffirmed-20260723
    decision: "The operator reaffirmed authorization for the exact staging-only Zoom configuration and human host/fictional-Student canary, the operator-owned media canary, and the private synthetic Telegram bridge canary. The media portion was consumed exactly once by the terminal PR #117 canary recorded under queued-video-to-classroom and grants no retry, second source, re-upload, retranscription, or broader publication. The still-open Zoom and Telegram work remains limited to its separately reviewed narrow jobs. Protected values remain outside Git/logs/screenshots/reports, customer sends remain separately gated, and no provider or production mutation may execute from this conductor's general repository work."
  - id: local-students-adult-ghl-parent-20260724
    decision: Children and Student credentials exist only in One Time and every Student belongs to a Parent household. GHL receives only the adult Parent contact and adult/household projection; no Student contact, child email placeholder, or child marketing record is created in GHL.
  - id: access-sources-not-payment-ledger-20260724
    decision: GHL remains authoritative for payment and subscription history. One Time keeps independent current paid, complimentary, and administrative-suspension source states plus one derived effective access projection and access/security audit, never invoices, charges, cards, amounts, refunds, or subscription mutation. Suspension wins; otherwise current paid or complimentary access grants. Revoking one source never deletes another.
  - id: paused-parent-active-identity-20260724
    decision: Parent authentication is independent of learning access. A paused Parent may use only the protected identity, recovery, and support shell; Students and learning routes are denied and Student sessions are revoked. Password reset remains available and is not a substitute for access authorization.
  - id: rabbi-operates-without-ghl-20260724
    decision: The Rabbi operates Parent/Student invitation, local Student creation, complimentary access, suspension, secure recovery, and communication from One Time or the scoped Rabbi Telegram bot. These actions project the adult to GHL asynchronously and never require the Rabbi to open GHL or expose a password.
  - id: focused-admin-navigation-20260724
    decision: Administrator primary navigation is Dashboard, Contacts, Content, Classroom, and Live Console. Studio is contextual under Content, Rewards under Classroom, household access under the Parent profile, and internal tasks under Contacts/Dashboard. Pages use category and subcategory menus with one focused body instead of multiple unrelated card groups.
  - id: distinct-telegram-bots-20260724
    decision: The One Time Rabbi bot is school-scoped for confirmed Parent/Student communication and internal tasks. The operator's BNA control-plane bot is a separate identity and deployment; it begins read-only/redacted and may gain a mutation only through an accepted replacement ADR and one bounded allowlisted capability at a time. Neither bot shares product sessions, secrets, transcripts, or database authority.
  - id: human-confirmed-content-publishing-20260724
    decision: Prompt patches, customer replies, and social posts are reviewed immutable revisions. Natural language may propose only structured scoped changes; every outbound action requires an exact preview and human confirmation, and only the leased worker may call the provider. Facebook text/image precedes YouTube, whose provider contract must be proven separately.
  - id: zoom-distinct-disposable-isolated-canary-20260724
    decision: 'The operator explicitly authorizes creation of exactly one distinct disposable operator-owned classroom meeting only inside the isolated PR #105 Zoom control-proof environment. It must never read, reuse, invite to, modify, delete, or otherwise act on the protected Tisha event meeting or any recurring Rabbi/customer meeting. The canary permits one operator host plus fictional Student 1 consent/join and bounded mute, request-unmute, spotlight, reset, replay, expiry, sibling, and idempotency proof; no customer invite or notification is allowed. Protected values remain outside Git, logs, screenshots, and reports. Persistent-staging and production variables/configuration remain unchanged. After sanitized readback, remove only the disposable meeting and canary-specific isolated configuration, confirm the Tisha meeting is untouched, and leave every persistent real/canary gate off. Human verification may be requested but never bypassed. This exact decision supersedes only the historical no-new-meeting restriction for the isolated canary and weakens no provider, scope, identity, or cleanup guard.'
  - id: git-published-ramble-packets-20260726
    decision: Every material operator ramble is sanitized into the existing OT-LAUNCH-01 input format and, when actionable, one Board-linked prompt packet. The conductor pushes that bounded packet before external ChatGPT Pro or Codex tasks rely on it. Local-only files, chat memory, historical PR descriptions, and unpushed worktrees are never assumed visible or current; BOARD.yaml remains the only status map and provider registries remain their existing canonical desired-state sources.
  - id: rabbi-campaign-office-sender-boundary-20260726
    decision: 'Rabbi-authored migration, warm enrollment, teaching, and new-program launch communication uses the existing rabbi_campaign identity, with preferred visible From Rabbi Eli Scheller | One Time Mishnayos <rabbi@onetimeonetime.com> only after mailbox/routing, GHL From acceptance, one operator-owned seed delivery, and reply-to-GHL readback pass. info@onetimeonetime.com remains the office and neutral brand identity for support, access, billing, administration, and ordinary operational notices. Account activation, login challenges, setup, verification, and password recovery remain One Time/Resend security mail. Existing-customer migration and separately consented nurture may share a reviewed content concept but never share inferred audience permission.'
  - id: historic-contact-and-attendance-deferred-20260726
    decision: The operator owns selection of the historic approximately 88 adult contacts and has removed historic-contact reconciliation and attendance analysis from the current launch critical path. Historic payment, attendance, event registration, deliverability, portal presence, or legacy tags cannot be used to infer current payment status, app access, or general-marketing permission.
  - id: production-approval-denied-until-ready-20260727
    decision: Production approval for Q07-001 is denied because the item is not ready. Keep the production lane blocked and the PRODUCTION lock disabled until one immutable candidate is accepted, backup/disposable-restore/forward-migration/rollback proof is accepted, every named dependency is satisfied, and fresh exact Board authority names the source, schema, cohort, routes, stop conditions, and rollback target. Do not request APPROVE PRODUCTION again before those prerequisites are accepted.
