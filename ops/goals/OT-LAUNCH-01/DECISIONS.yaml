schema_version: 1
goal_id: OT-LAUNCH-01
decisions:
  - id: canonical-status
    decision: BOARD.yaml is the only current status map; reports link to it rather than copying mutable status or SHAs.
  - id: preview-boundary
    decision: Experience Preview is an explicit isolated_staging/test capability with an independent enable flag and production fail-closed checks.
  - id: no-impersonation
    decision: Role cards render server-produced read-only data; only the three fictional Students may open short-lived preview sessions in separate tabs.
  - id: scenario
    decision: The Cohen family and Berachos 2:1 learning unit replace random fixture narratives on persistent staging.
  - id: provider-truth
    decision: A provider remains off until exact terminal evidence proves activation; independent tracks continue meanwhile.
  - id: ghl-authority
    decision: Agent Mode mutates GHL and returns sanitized readback; Codex alone updates canonical Git state.
  - id: ghl-github-control
    decision: GitHub workflow-registry.yaml is the single editable HighLevel automation inventory; current.json and workflows.yaml are source-hashed generated projections, the human report is generated, observed GHL is evidence rather than authority, and MISSING/DRAFT_SHELL/DRAFT_WAITING_EXTERNAL/SAVED_REOPENED/ACTIVE_CONFIGURED/ACTIVE_TESTED/DRIFTED/BLOCKED are the only workflow control states.
  - id: ghl-closed-loop
    decision: A reviewed Git job may close only through browser apply, save, navigate/reload, reopen/readback, bounded authorized canary, sanitized committed result, and drift validation; unknown workflows fail closed and may enter 99 - Deprecated only after dependency checking and separate safe authorization, never silent deletion.
  - id: visual-execution-loop
    decision: Visual intent is converted into route/breakpoint acceptance, inspected against current screenshots/page state, automatically repaired when the violation is obvious and in scope, retested, and verified at the deployed URL; the operator is asked only for a genuine product decision.
  - id: assignment-authority
    decision: The persistent-staging conductor assigns tracks before dispatch; non-conductors verify assignment and write only their handoff, never BOARD.yaml.
  - id: ghl-dispatcher
    decision: One canonical outbox-backed One Time to GHL dispatcher owns app events/tags/bot invocations; workflow shells stay DRAFT_WAITING_EXTERNAL on the exact app/adapter contract until producers pass.
  - id: migration-prefix
    decision: Preserve PR #104 migration 2214_learning_delivery_content_factory and use 2215_experience_preview_sessions for Experience Preview.
  - id: migration-history
    decision: Live 2209/2210 duplicate-prefix ledger rows are legitimate immutable history; 2216 is reserved for new schema, and a required HighLevel 2205 must be integrated exact and unchanged.
  - id: status-semantics
    decision: Pending tests, deployment, reseed, or convergence are remaining_work/pending verification; blocked is reserved for an actual impasse.
  - id: ghl-asset-kinds
    decision: OT-C01 names two distinct live Draft/unsent assets and they are never collapsed. Workflow wrapper f28d8b8a-c26a-4a4f-a9f2-d2a8e94af1ae is under One Time / 45 - Events / 2026 / Tisha B'Av 2026; campaign 6a5f750b557817806a14b19e is under Marketing / Email Campaigns / Home with zero recipients/sends. OT-A1 and knowledge bases are non-workflow assets and never inflate workflow counts.
  - id: ghl-visible-closeout-fail-closed-20260722
    decision: PR #107 closeout c9f7794 remains authoritative for exhaustive visible inventory truth, while terminal PR #107 head 1e247c70004dffb6247fc1ee407f1153d753bd7d is authoritative for the later OT-E01 Email A save/reopen and failed fresh-signup handoff readback. Seventeen non-Tisha canonical workflows are DRAFT_SHELL with empty trigger/action canvases; OT-E01 alone retains the historical controlled GHL-only ACTIVE_TESTED canary, but current application registration end to end is blocked because the new signup produced no exact tag or enrollment. The same-name OT-C01 wrapper and legacy KB remain visible drift, OT-A1 current visibility is unverified, and absent archived/hidden-AI UI coverage must never be inferred empty or used to authorize quarantine/deletion.
  - id: tisha-production-registration-handoff-failure-20260722
    decision: The operator's newest production Tisha signup produced an account/login-code email but no exact registered-event tag, OT-E01 enrollment, or event confirmation. No manual tag/enrollment, substitute/fallback email, duplicate signup, customer test, or WhatsApp action is permitted. Queued OT-TISHA-HANDOFF-01 on release/tisha-bav-2026-live owns only the application server registration/tag/enrollment/fallback repair and narrow production hotfix; after proof it must reprocess the one affected existing operator contact exactly once and prove no duplicate enrollment/delivery. PR #110 remains visual-only and PR #107 remains the sole GHL UI writer.
  - id: provider-approval-gates
    decision: Enrollment, publication/activation, broad sends, payments, production change, quarantine/deprecation, and destructive action each require separate exact authority; no gate implies another.
  - id: zoom-config-contract
    decision: Meeting SDK uses canonical ZOOM_MEETING_SDK_CLIENT_ID/CLIENT_SECRET/WEB_VERSION with KEY/SECRET temporary aliases only; S2S OAuth uses separate ZOOM_S2S_ACCOUNT_ID/CLIENT_ID/CLIENT_SECRET with ZOOM_ACCOUNT_ID as a temporary account-ID alias, and ZOOM_UI_PREVIEW never implies ZOOM_REAL_CONTROL.
  - id: queued-video-to-classroom
    decision: VIDEO-TO-CLASSROOM-E2E is the next queued implementation after PR #97 governance and independently accepted PR #108 convergence; this conductor pass records its acceptance contract but does not implement it.
  - id: tisha-ot-c01-email-invitation-20260722
    decision: Historical authorization named f28d8b8a-c26a-4a4f-a9f2-d2a8e94af1ae, which terminal readback later proved is the Draft workflow wrapper rather than the separate Email Marketing campaign 6a5f750b557817806a14b19e. No send occurred. This decision is fully superseded by tisha-event-permission-supersedes-ot-c01-send-20260722 and grants no current mutation, audience, schedule, or send authority to either asset.
  - id: tisha-ot-e01-registered-direct-class-link-exception-20260722
    decision: The newest direct operator instruction permits the protected direct class link already supplied to the sole GHL executor only in exact OT-E01 registered-contact email delivery tonight, limited to the immediate confirmation and/or one-hour/ten-minute reminders for contacts enrolled through the canonical registration trigger and still email-eligible. OT-C01 keeps only https://join.onetimeonetime.com/tisha-bav; no WhatsApp is permitted. Exact OT-E01 ID, idempotent registration, late-skip timing, in-flight enrollment behavior, save/reload/reopen readback, and all eligibility gates must remain. Git, BOARD, logs, screenshots, browser proof, final reports, and public/customer pages may record only protected direct class link present/valid and must never contain the URL. Every unrelated provider-link restriction remains in force.
  - id: tisha-event-permission-supersedes-ot-c01-send-20260722
    supersedes: tisha-ot-c01-email-invitation-20260722
    decision: The newer event-permission instruction withdraws OT-C01 send authority. There is no newsletter checkbox; the exact registration disclosure is “By reserving, you’ll receive emails about this event.” Registration grants only scoped Tisha event-email permission and never newsletter/general-marketing consent. DND, suppression, unsubscribe, complaint, and hard bounce always win. OT-E01 uses the exact event-registration permission/marker rather than newsletter/global Email Opt-In, while its repaired direct-class-link exception remains sanitized. OT-C01 stays Draft, unseeded, unscheduled, and at zero sends; its invitation audience is read-only evidence classification only, 207 email-capable contacts are not opted in, and only synthetic/operator-owned verification with zero customer email is permitted. A separate governed coding task owns durable permission/schema/classification outside PR #108 and this conductor pass.
  - id: event-service-email-authority-and-deny-precedence-20260722
    decision: Application DB is authoritative for append-only account/product/event/contact-scoped event_service_email permission history and current projection; GHL fields/tags are projections only and no existing contact receives inferred/backfilled permission. Registration atomically and idempotently grants only the fixed disclosed Tisha event scope, queues projection, records disclosure version/source/timestamps, never grants marketing consent, and cannot override withdrawal/suppression. Typed deny precedence is complaint/hard bounce, global suppression/DND, global unsubscribe, event withdrawal/cancellation, invalid/ambiguous identity, then missing active event permission. OT-E01 requires matching registration plus active event permission and rechecks at send time; OT-C01 remains Draft/unseeded/unscheduled/unsent. The separate coding lane uses the next globally free forward-only migration after convergence without assuming a number, synthetic/operator-owned tests only, and zero GHL/customer/WhatsApp mutation in this conductor pass.
