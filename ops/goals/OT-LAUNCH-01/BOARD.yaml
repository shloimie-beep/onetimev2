status_definitions:
  unclaimed: Conductor has not assigned executable work.
  active: Assigned work is progressing without an impasse.
  waiting_external: Safe independent work is complete and terminal external evidence is pending.
  ready_for_convergence: Terminal handoff exists and semantic integration/readback remains.
  done: Acceptance is proven and no remaining work exists for this track.
  blocked: A genuine authority, dependency, or technical impasse prevents meaningful progress.
  provider_off: Provider activation gates are intentionally off and the UI must say so.
  needs_operator_decision: Work cannot proceed without an explicit product or send authorization.
  superseded: Another canonical track or handoff replaced this work.

