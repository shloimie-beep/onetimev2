schema_version: 1
goal_id: OT-LAUNCH-01
source_of_status: ops/goals/OT-LAUNCH-01/BOARD.yaml
evidence_types:
  api: status, headers, sanitized response shape, and audit/readback query
  browser_desktop: Playwright trace or screenshot at 1280px or wider
  browser_mobile: Playwright trace or screenshot at 360px
