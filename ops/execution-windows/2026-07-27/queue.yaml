board_path: ops/goals/OT-LAUNCH-01/BOARD.yaml
index_path: ops/execution-windows/2026-07-27/WINDOW-INDEX.md
locks_path: ops/execution-windows/2026-07-27/writer-locks.yaml
dependencies_path: ops/execution-windows/2026-07-27/dependencies.yaml
decisions_path: ops/execution-windows/2026-07-27/decisions-needed.md
source_of_goal_status: ops/goals/OT-LAUNCH-01/BOARD.yaml
queue_semantics: >-
  dispatch_state coordinates claims and terminal execution attempts only. It
  never overrides Board goal status, acceptance, provider truth, production
  authority, or operator decisions.
selection:
  order: [priority_ascending, sequence_ascending, id_ascending]
  runnable_when:
    - item.lane exactly equals the worker WINDOW ID before any other field is evaluated
    - assignment_state is assigned
    - dispatch_state is ready
    - every dependency is terminal done or an accepted external gate
    - every required lock is free or already held by the same claim token
    - the current remote Board row still authorizes the exact task and scope
  stale_chat_rule: >-
    Before every claim and before every successor, fetch queue_ref and reread
    queue.yaml, writer-locks.yaml, dependencies.yaml, decisions-needed.md, and
    the referenced current Board rows from the fetched remote head. Chat text
    can bootstrap a lane but cannot keep an item runnable after Git changes.
dispatch_states:
  nonterminal: [planned, ready, claimed]
  terminal: [done, blocked, cancelled, superseded]
assignment_states: [planned, assigned, withdrawn]
lane_routing:
  candidate_filter: >-
    Before reading assignment state, dispatch state, dependencies, locks,
    branch, scope, or result fields, build the candidate set by filtering
    items to item.lane == the worker's exact WINDOW ID. A non-control worker
    must not evaluate, claim, execute, terminalize, or repair any item outside
    that filtered set.
  id_prefix_guard:
    01-OT-CONTROL: Q01-
    02-OT-ZOOM: Q02-
    03-OT-GHL: Q03-
    04-OT-PRODUCT: Q04-
    05-OT-HYGIENE: Q05-
    06-BNA-CONTROL: Q06-
    07-OT-PRODUCTION: Q07-
  dependency_rule: >-
    A cross-lane dependency may be read only as accepted or not accepted. It
    does not make the dependency item a candidate and grants no authority to
    inspect, claim, execute, terminalize, or repair that other lane's work.
  control_exception: >-
    01-OT-CONTROL may inspect cross-lane GitHub evidence and reconcile
    canonical state, but its own claim candidates remain limited to
    lane == 01-OT-CONTROL and IDs beginning Q01-.
  mismatch_rule: >-
    If an item's lane and ID prefix disagree, or a lock holder's lane does not
    match the lock permanent_lane, no worker may act on that item or lock.
    Leave it unclaimed and let 01-OT-CONTROL repair the coordination state.
allowed_manual_handoffs:
  - SIGN IN
  - APPROVE SEND
  - APPROVE PRODUCTION
  - APPROVE DESTRUCTIVE ACTION
  - PRODUCT DECISION REQUIRED
  - BLOCKED
claim_protocol:
  queue_mutation_scope:
    - A non-control lane may edit only its own item claim/result/terminal fields in queue.yaml.
    - A claiming or releasing lane updates required lock holders in writer-locks.yaml in the same queue-control commit.
    - Only 01-OT-CONTROL may edit BOARD.yaml, dependencies.yaml, decisions-needed.md, assignments, priorities, scopes, or another lane.
  compare_and_swap:
    - Fetch queue_ref immediately before the queue-control edit.
    - Base the queue-control commit on the exact fetched head.
    - Push without force directly to queue_ref.
    - If rejected, fetch, replay only the lane-local claim or terminal update, revalidate dependencies and locks, and retry at most three times.
    - Never resolve a conflict by deleting another lane claim, result, dependency, or lock.
  claim_fields:
    - claim_token
    - worker_task_id
    - claimed_at
    - claimed_from_queue_head
  terminal_fields:
    - terminal_at
    - terminal_reason
    - result_commit
    - result_pr
    - result_path
    - validation_summary
    - external_effects
  no_time_expiry: >-
    Claims and locks never expire by age. Only the same worker may release its
    claim, or 01-OT-CONTROL may clear it after a read-only abandoned-worker
    audit and a committed Board/queue reconciliation.
result_protocol:
  - Commit and push the scoped task result before marking the queue attempt terminal.
  - Open or update the task draft PR when the assignment requires one.
  - Mark the attempt terminal and release its locks in one queue-control commit.
  - The control lane polls GitHub for every assigned or claimed lane branch and reconciles verified result PRs even when a worker did not update the queue.
  - Fetch and reread the remote queue again before selecting a successor.
  - Continue immediately to the next unblocked assigned item in the same lane.
  - If no assigned item is runnable, remain idle and poll remote Git and GitHub; do not ask the operator for ordinary status relay.
lanes:
  - id: 01-OT-CONTROL
    ordinal: 1
    bootstrap_path: ops/execution-windows/2026-07-27/01-OT-CONTROL.md
    permanent_scope: Board, queue, dependency, lock, decision, and result reconciliation only.
  - id: 02-OT-ZOOM
    ordinal: 2
    bootstrap_path: ops/execution-windows/2026-07-27/02-OT-ZOOM.md
    permanent_scope: Exactly assigned Zoom provider tasks; no product, Board, or unrelated meeting mutation.
  - id: 03-OT-GHL
    ordinal: 3
    bootstrap_path: ops/execution-windows/2026-07-27/03-OT-GHL.md
    permanent_scope: One HighLevel repository or browser task at a time under its exact lock.
  - id: 04-OT-PRODUCT
