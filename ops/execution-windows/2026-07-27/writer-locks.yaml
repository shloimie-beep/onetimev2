invariants:
  - Only 01-OT-CONTROL writes BOARD.yaml.
  - At most one GHL repository writer.
  - At most one GHL browser writer.
  - At most one Zoom provider writer.
  - At most one One Time product writer.
  - At most one migration writer.
  - No production writer until every named dependency and fresh production authority are accepted.
  - A claim or lock cannot be stolen or expired by time.
