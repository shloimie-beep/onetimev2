schema_version: 1
default:
  provider_access: none
  live_mutation_authority: false
  lock_granularity: effectful subphase only
  rule: Provider-relevant code, declarative definitions, and local tests may proceed with no provider access. Exact
    scoped read-only access requires C00 authorization but is nonexclusive. A live/sandbox mutation or bounded send/charge/publish/enroll
    operation requires an explicit authority record and exclusive time-bounded lock.
