schema_version: 1
execution_id: OT-V21-PRODUCTION
task_id: R45
title: Final Interactive Certification and Cutover Decision
outcome: Certify every visible control and all release invariants against the same immutable candidate, confirm
  legal/provider/operations gates, and execute or withhold production cutover with auditable reasoning.
kind: release
wave: 11
priority: launch_critical
execution:
  model: GPT-5.6-SOL
  reasoning: XHIGH
  service_tier: PRIORITY
  mode: START_OR_RESUME
  branch_template: codex/v21-r45-release-<candidate-short-sha>
  harness_branch_template: null
  maximum_active_writers_in_group: 1
dependencies:
  start_after:
  - R44
  - V43
  required_start_states:
    R44: operator_accepted_and_evidence_aggregated
    V43: phase_b_candidate_verified_passed_and_aggregated
  merge_after: []
  candidate_integration_partners: []
  candidate_requires_all_implementation_tasks: false
  acceptance_after: []
  first_run_start_sha_source: origin/codex/v21-control:ops/v2.1-execution/control/READY-QUEUE.yaml authorized_start_sha
interface_checkpoint:
  required: false
  unlocks: []
  contract_schema_version: 1
  required_export_roots: []
  must_record_exact_realized_paths_symbols_versions_and_digests: true
  rule: No downstream contract checkpoint required.
scope:
  writer_slots:
  - FINAL_RELEASE_AUTHORITY
  normalized_owned_globs:
  - ops/v2.1-execution/authority/<candidate-digest>/R45/**
  - ops/v2.1-execution/effects/<candidate-digest>/R45/**
  - ops/v2.1-execution/merge/FINAL-RELEASE-DECISION.yaml
  - ops/v2.1-execution/observations/<candidate-digest>/**
  - ops/v2.1-execution/results/<candidate-digest>/R45/**
  scope_notes_only:
  - production deployment/DNS only when explicitly authorized and all gates pass
  explicit_path_excludes: []
  forbidden_shared_paths: []
  external_authority: explicit final release and production mutation authority after every release gate passes
coverage:
  primary_requirement_ids: &id001
  - OTV2-OPS-175
  primary_acceptance_case_ids: &id002
  - OTV2-OPS-175-AC01
  verification_of_tasks: []
  verification_requirement_ids: *id001
  verification_acceptance_case_ids: *id002
  decision_ids:
  - DEC-004
  - DEC-007
  - DEC-133
  - DEC-152
  required_source_documents:
  - 11-ENVIRONMENT-FIXTURE-CANARY-MANIFEST-v2.1.yaml
  - 12-MIGRATION-CUTOVER-ROLLBACK-v2.1.md
  - 13-OPERATIONS-SLO-DR-INCIDENT-v2.1.md
  embedded_normative_sections:
  - PS-028 through PS-030 certification and final checklist
  - OPS-080 through OPS-084 deployment, observation, and legal gate
deliverables:
- interactive-element inventory with all five required zero counts
- candidate/environment/provider/legal/effect reconciliation
- final release decision with no unauthorized waivers
- production deploy/cutover verification or an exact blocked-release record
- rollback readiness and post-deploy readback
notes: []
terminal_states:
- certification_evidence_ready
- release_decision_recorded
definition_of_done:
- Every assigned behavior is implemented or, for verification/release tasks, every assigned case has a schema-valid
  candidate-bound result.
- The diff remains inside owned paths plus structured steward requests.
- Task-owned verification passes; ordinary in-scope failures are diagnosed and corrected.
- No prohibited product surface, fake fallback, security/privacy weakening, or unauthorized external effect is introduced.
- TASK-STATE.yaml, HANDOFF.md, and NEXT-PROMPT.md are current.
- 'All checkpoints are committed and pushed; this task may end only in one of these exact task-local terminal states:
  certification_evidence_ready, release_decision_recorded.'
checkpoint_policy:
  interval_minutes: 30-45
  mandatory_before:
  - long-running command
  - authorized external effect
  - window end
  mandatory_after:
  - interface contract
  - migration or invariant
  - meaningful milestone
  - blocker discovery
stop_conditions:
- missing explicit authority or provider identity for a required live effect
- writer/path/provider lock collision
- non-fast-forward push
- normative contradiction requiring operator decision
- incompatible or absent upstream interface contract
- applied migration would need modification
- continuation would weaken a protected invariant
- destructive operation lacks exact target/authority
- reproduced out-of-scope failure blocks progress after all safe independent work is complete
