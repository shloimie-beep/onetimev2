definition_of_done:
- Every assigned behavior is implemented or, for verification/release tasks, every assigned case has a schema-valid
  candidate-bound result.
- The diff remains inside owned paths plus structured steward requests.
- Task-owned verification passes; ordinary in-scope failures are diagnosed and corrected.
- No prohibited product surface, fake fallback, security/privacy weakening, or unauthorized external effect is introduced.
- TASK-STATE.yaml, HANDOFF.md, and NEXT-PROMPT.md are current.
- 'All checkpoints are committed and pushed; this task may end only in one of these exact task-local terminal states:
  ready_for_review, postoperator_supporting_proof_ready.'
checkpoint_policy:
  interval_minutes: 30-45
  mandatory_before:
  - long-running command
  - authorized external effect
  - window end
  mandatory_after:
  - interface contract
  - migration or invariant
  - meaningful milestone
  - blocker discovery
stop_conditions:
- missing explicit authority or provider identity for a required live effect
- writer/path/provider lock collision
- non-fast-forward push
- normative contradiction requiring operator decision
- incompatible or absent upstream interface contract
- applied migration would need modification
- continuation would weaken a protected invariant
- destructive operation lacks exact target/authority
- reproduced out-of-scope failure blocks progress after all safe independent work is complete
