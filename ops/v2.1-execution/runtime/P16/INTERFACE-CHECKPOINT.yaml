compatibility_invariants:
  - The launch catalog has exactly one immutable active canonical series: Sunday through Thursday at 19:00 Asia/Jerusalem for 60 minutes.
  - Additional series creation and archived-series restoration always persist draft with zero occurrence, enrollment, provider, communication, or family-visibility effects until explicit Admin activation.
  - Series transitions are exactly draft to active or archived, active to paused or archived, paused to active or archived, and archived to draft; every other transition fails without a write.
  - Occurrence transitions are exactly none to scheduled, scheduled to preparing, preparing to ready, ready to live, live to completed, pre-live to canceled, and future canceled to scheduled; completed is terminal.
  - Occurrence identity is stable as series plus Jerusalem local class date, and reschedule/restore increments schedule version while requiring old launch grants to remain revoked.
  - Every active Student has exactly one active canonical enrollment; activation, restoration, archive, credentials/access coordination, enrollment, receipt, and audit compose in one repository transaction.
  - Canonical enrollment has no request, approval, opt-out, or manual unenroll operation; governed future noncanonical unenrollment remains available.
  - Reconciliation repairs missing, extra, revoked, or duplicate canonical rows once and is a no-op on the second execution.
  - Commands are tenant/product scoped, optimistic-version fenced, request-hash bound, and replay idempotently; provider calls remain outside database transactions.
