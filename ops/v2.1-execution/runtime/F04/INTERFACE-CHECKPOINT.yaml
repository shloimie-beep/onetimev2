compatibility_invariants:
  - One normalized adult email resolves to one AdultIdentity and one HumanAccount; exact adult memberships are admin, parent, or both.
  - Every adult request carries one explicit server-validated role context; role changes rotate the session and apply the exact Admin or Parent idle/absolute expiry policy.
  - Parent household context is selected only from server-resolved ownership links; direct sibling or cross-household identifiers fail closed.
  - Parent capability composition never includes Student class, library, recording, private-question, or Student-notice access; an adult learner remains a separate self Student with separate credentials and consumes one seat.
  - Each household has one current owner while one adult may own several independently scoped households.
  - Ownership transfer is Admin-assisted, seven-day, single-use, idempotent, version-checked, and atomic; an active outgoing-owner self Student blocks acceptance.
  - A self Student is archived or moved only without changing its relationship, identifier, credential, or immutable history; cross-owner and full-seat moves fail closed and revoke Student sessions/grants.
  - Remaining dependent Students require one current replacement-owner authority plus service-account and recording-participation attestation for each exact Student.
  - Transfer to an existing Admin adds parent idempotently to that HumanAccount, creates no duplicate login, changes no financial identity, revokes old household-authorizing sessions and billing/action tokens, and emits audit/provider intents.
  - Product, runtime tier, and verification environment use the F02 canonical isolation mapping and cannot cross scopes.
  - Schema creation is migration-only; F04 requests F02 migration authority and I36 barrel/server registration without editing those hotspots.
