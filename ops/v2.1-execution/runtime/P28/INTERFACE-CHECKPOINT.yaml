compatibility_invariants:
  - Every GHL subject is adult_only; a Student is rejected before persistence, readback, lead capture, or provider access.
  - Reminder preference is exactly email, whatsapp, both, or none; invalid values fail without a partial write.
  - While WhatsApp is dormant, email remains active for email, whatsapp, and both, none suppresses optional reminders, and WhatsApp records channel_skipped_not_configured with zero provider calls.
  - Requested security and essential billing/access email cannot be disabled by reminder or marketing preferences while the email remains deliverable; their transport is Resend.
  - Optional and marketing email recheck DND, unsubscribe, complaint, hard bounce, invalid address, and purpose-specific suppression immediately before delivery.
  - Rabbi campaign From is rabbi@onetimeonetime.com, every reply-to is info@onetimeonetime.com, and office/brand From is info@onetimeonetime.com.
  - Communications Review denies non-Admin actors before loading data and exposes sanitized readback plus governed Start/Pause requests only; campaign editor, test-send, seed-send, and provider-canary controls remain absent.
  - OT-B01 is public-website Family/School adult lead capture and cannot qualify through WhatsApp, create Students, grant access, or promise School pricing.
  - Workflow fragments from P29/P30 require unique OT-01 through OT-16 keys, adult-only subject, email-required/dormant-WhatsApp behavior, idempotency, send-time suppression, and the six foundational approval gates.
  - Registry identifiers cannot be silently reused; OT-11 is retired/reserved, OT-12 is adult support, OT-14 is Parent Newsletter, OT-15 is Former Member Reactivation, and the historical OT-B01 provider ID is not assigned to the new website-bot purpose.
  - Persistence is parameterized and migration-only; central registration, generated projections, shared message-class coverage, and applied migrations are stewarded separately with no external-effect authority.
