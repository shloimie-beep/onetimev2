schema_version: 1
execution_id: OT-V21-PRODUCTION
task_id: P10
requests:
  - request_id: P10-MIGRATION-001
    kind: migration
    requested_steward: I36
    status: proposed
    source_contract:
      path: packages/contracts/src/admin/directory/index.ts
      version: 2.1.0
    exact_targets:
      - packages/db/migrations/<allocated>_v21_admin_directory.sql
      - packages/db/src/admin/directory/**
    required_changes:
      - Materialize the F04 AdultIdentity, HumanAccount, Household, and StudentProfile aggregates plus the P10 AdminStudentRecord, StudentCredentialReset, AdminDirectoryReceipt, and AdminDirectoryAuditEvent persistence contracts.
      - Scope every record, lookup, uniqueness constraint, and foreign key by product, runtime tier, and verification environment; reject any cross-scope batch before writes.
      - Enforce one normalized adult email identity, one HumanAccount per adult, exact assignable memberships admin and parent, multiple owned households per adult, a global scope-bound normalized Student username unique constraint, optimistic versions, and immutable Student identity, credential, and history references.
      - Enforce exactly three seats for Family households. Persist School allowances only with immutable contract reference, reason, authorized time, seat count, and an audit event; reject an unbound allowance change.
      - Store only F03-current `argon2id-v1$v=19$...` credentials that pass the F03 policy validator; reject malformed, obsolete, or leading-dollar lookalikes. Never store Student email/HighLevel identity or a recoverable/displayable password.
      - Implement every AdminDirectoryUnitOfWork lock and readback port exactly: active-Admin count, owned-household inventory, current service-account version, global normalized username, active Students by household, and aggregates are locked in the transaction.
      - Implement `revokeAllActiveAccess` as an exhaustive scope-bound operation, not an ID list supplied by the route. It must revoke all active sessions, canonical enrollments, classroom grants, and playback grants and return complete exact readback.
      - Make aggregate/profile/credential, current service-account acceptance/evidence, canonical enrollment, exhaustive revocations/readback, allowance audit, command receipt, audit event, and ownership-transfer result one transaction with unique scope plus idempotency key and immutable canonical request hash.
      - Reconcile any pre-v2.1 rabbi or owner labels through F03 compatibility normalization without retaining either as an assignable runtime role; teacher remains profile data only.
    validation:
      - Apply the full migration inventory in a disposable PostgreSQL-compatible database.
      - Prove rollback on injected write failure after revocation, stale-version denial, concurrent same-key replay, different-hash conflict, cross-environment isolation, concurrent global Student username uniqueness, exact Family/School seat enforcement, exhaustive revoke-all readback, and persistence after a fresh authenticated session.
    external_effects_authorized: false
  - request_id: P10-REGISTRATION-001
    kind: registration
    requested_steward: I36
    status: proposed
    exact_targets:
      - packages/contracts/src/index.ts
      - packages/domain/src/index.ts
      - packages/db/src/index.ts
      - apps/web/src/server central authenticated route composer
      - apps/web/src/client central Admin route composer
    required_changes:
      - Re-export the P10 directory contract and domain roots without semantic changes, resolving legacy AdminDirectory symbol collisions in favor of the v2.1 contract.
      - Implement AdminDirectoryRepository with a real transaction and register AdminDirectoryService behind authenticated same-origin, CSRF-protected Admin-only routes.
      - Construct AdminDirectoryActor exclusively from the F03 server-validated principal and configured product/runtime/environment; ignore client-supplied role, household, Student, account, runtime, and environment values.
      - Route create/edit/archive/restore, credential reset, and verified sole-ownership transfer through the P10 domain operations before committing their durable batches; the route cannot provide role, active-Admin count, ownership, username availability, service-account version, active-session IDs, active-Student inventory, enrollment, or grant inventory.
      - Replace the legacy admin-directory composer and UI path with AdminDirectoryWorkspace; do not expose owner or rabbi as assignable roles and do not attach Parent identities to learner records.
      - Revoke every affected session on adult email/lifecycle/membership changes; deny disabled-account reactivation, final-active-Admin archive, and owner archive using locked repository evidence.
      - Student create/restore must lock household/access/capacity/version/username and current service-account acceptance, then atomically persist active profile+credential, canonical enrollment, evidence, audit, and receipt. Student and household archive invoke exhaustive session/enrollment/classroom/playback revocation; household restore remains access-inactive until the independent access source grants it.
      - Replace direct destructive UI commits with the P10 consequence-confirmation flow and preserve URL-backed search, kind/status filters, archived visibility, sort, and pagination state.
      - Keep Student data out of HighLevel and all provider effects; a later authorized provider projection may consume adult-only durable intents after commit.
    validation:
      - Run typecheck, direct-route and forged-principal denial tests, CSRF tests, rollback/concurrency/replay tests, refresh/re-login persistence tests, URL-state/confirmation keyboard-accessibility checks, and route inventory proving the legacy role/Student-email surface is unreachable.
    external_effects_authorized: false
