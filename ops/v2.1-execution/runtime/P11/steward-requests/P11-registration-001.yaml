rationale: P11 owns isolated Admin dashboard, search, operations service, contract, and domain modules but not the central client/server composers or root contract/domain barrels.
desired_semantic_change: Register the real-data Admin operating dashboard, private authorized global search, and navigation-time target resolver at their canonical routes; bind session/cache invalidation and partner composition duties; and re-export the P11 contract/domain roots without changing their semantics.
proposed_symbols_routes_keys_or_dependencies:
  - Export packages/contracts/src/admin/operations/index.ts from the steward-owned Admin contract barrel.
  - Export packages/domain/src/admin-search/index.ts from the steward-owned domain barrel.
  - Register AdminOperationsService from apps/web/src/server/features/admin/operations/index.ts behind a current server-validated Admin session.
  - Register readDashboard at GET /api/v2.1/admin/dashboard with private no-store response headers and no fallback snapshot.
  - Register search at POST /api/v2.1/admin/search with a small JSON body limit, same-origin/CSRF enforcement, private no-store response headers, and no request-body, query, result, or target logging or analytics.
  - Register resolveNavigation at POST /api/v2.1/admin/operations/resolve with same-origin/CSRF enforcement, private no-store response headers, and a fresh current-session Admin plus exact product/runtime/verification-environment check on every selected target immediately before navigation.
  - The resolver must ignore client role/scope/destination data, accept only kind, safe target ID, and selected credential version, reread current target authorization, return one neutral missing_or_unauthorized outcome for missing/archived/revoked/stale targets, and construct only the contract allowlisted same-origin canonical route.
  - Construct AdminOperationsActor only from the validated F03 principal plus configured product, runtime tier, and verification environment; ignore all client-supplied role, scope, account, household, Student, runtime, and environment fields.
  - Render apps/web/src/client/app/admin/dashboard/index.ts at /app/dashboard and apps/web/src/client/app/admin/search/index.ts at /app/search in the existing F07 Admin shell.
  - Client result activation must call the resolver and navigate only when it returns state open; never navigate directly from persisted or cached result destination data.
  - Propagate current role and credential/session version into the Admin search composition. On sign-out, role revocation, session-version change, or pageshow restored from bfcache, clear in-memory results, opaque cursor state, recent private queries, and any Admin-search local/session cache before reauthorization.
  - F03/F07 must invalidate the dashboard/search composition on session revocation and must not allow browser-history restoration to display stale private results or operational snapshots.
  - Add canonical Admin header search navigation without placing terms in the URL, referrer, analytics, or route state; pagination remains opaque POST-body state.
  - Preserve the canonical static links for Communications, Tickets, Billing & Access, Integrations, Operations, Audit, and Live Console. Do not synthesize data for an unavailable partner route.
  - Partner-owned quick-action routes must preserve the locked canonical paths, reauthorize at route entry, open real persistent forms/workspaces, and show unavailable when a partner route is not registered; they must not be replaced by legacy or demo routes.
  - Compose PS-025.3 release/source, web/worker, database/migration, queue, provider, backup/restore, and redacted-failure readbacks from exact environment-scoped operational evidence; retain explicit unavailable states when partner evidence is absent.
compatibility_assumptions:
  - F03 supplies the current server-validated Admin principal and denies stale, Parent, Student, household-bound, and cross-environment sessions.
  - F03 supplies a current credential/session version and sign-out/role-revocation invalidation event; P11 does not mint, refresh, or revoke sessions.
  - F05/F06/P33 persistent operational tables remain the only dashboard and search sources; absent rows render truthful empty or unavailable states.
  - F07 shell and design tokens are reused without modification.
  - Partner-owned utility routes are registered by their owners/I36 and may remain unavailable until integration without triggering a P11 fictional fallback.
  - Provider-readiness source environment is preserved and filtered to the configured runtime and verification environment; integration must not relabel fixture/test/staging readiness as production or live.
verification_performed:
  - P11 focused domain, PostgreSQL service, dashboard, and global-search tests.
  - Workspace TypeScript typecheck.
  - Focused ESLint, Prettier, diff, and secret checks.
conflicts_or_risks:
  - The route layer must never serialize or log private search terms in URLs, referrers, analytics, diagnostics, audit metadata, or error messages.
  - Search must fail closed before returning any result when the actor, scope, result destination, source, or entity kind is invalid.
  - A stale authorized search result must never become a navigation authority; current session and selected-target authorization are both rechecked by the resolver.
  - Sign-out, role revocation, session-version rotation, and bfcache restore must not retain or reveal cached private search results.
  - Central registration must not expose a legacy Admin dashboard/search fallback, test lab, preview lane, or fictional record source.
contains_secret_or_private_data: false
