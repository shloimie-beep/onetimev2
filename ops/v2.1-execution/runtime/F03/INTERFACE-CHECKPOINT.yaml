compatibility_invariants:
  - Assignable public roles are exactly admin, parent, and student; owner and rabbi migration-history values normalize to admin at the application boundary.
  - Adult login is normalized email plus password; Student login is normalized username plus password and never requires Student email or a HighLevel contact.
  - Routine authentication is password-only with no email challenge, MFA, recovery code, or trusted-device requirement.
  - Adult passwords contain 12 through 128 Unicode code points and Student passwords contain 8 through 64; no composition rule is invented, and common, compromised, or identity-equivalent values are rejected.
  - New credentials use uniquely salted versioned Argon2id hashes; successful authentication may replace an obsolete valid hash without exposing or transforming the password.
  - Admin, Parent, and Student sessions use exact idle/absolute limits of 30 minutes/12 hours, 24 hours/30 days, and 7 days/30 days; absolute expiry is never sliding.
  - Setup and reset tokens are stored only by hash, single-use, valid for exactly seven days and 60 minutes respectively, and a replacement supersedes every earlier unused token for the subject and purpose.
  - Login, reset, and setup resend throttles use the exact v2.1 account/IP thresholds and recover after the configured window without permanent lockout or account enumeration.
  - Credential, role, ownership, disable/archive, and explicit revocation events revoke affected sessions; reactivation never restores an old credential or session.
  - Same-origin state changes require CSRF, session cookies are host-only Secure HttpOnly SameSite=Lax, and return targets remain within role-allowlisted same-origin paths.
  - Passwords, raw token values, child data, provider links, and external identities are absent from audit-safe interfaces and public denial responses.
