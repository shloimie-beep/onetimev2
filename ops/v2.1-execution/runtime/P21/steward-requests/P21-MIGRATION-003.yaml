rationale: >-
  Source head 38156528c1c022a0575db71426ce2cc8f2e20ab8 completes the
  source-complete P20-to-P21 publication projection contract, while integrated
  migration 2252_v21_content_publication.sql remains immutable at raw SHA-256
  7981b9cf9805ec9bfba7005e7688034bacb90f5e730d0e593c43202c68afeafc
  and still validates the superseded 13-field projection and 4-field artifact
  shape. P21-MIGRATION-002 is immutable historical request evidence and must
  never be repurposed. F02 must allocate the exact forward-only successor
  2253_v21_content_publication_projection_v2.sql.
desired_semantic_change: >-
  In 2253_v21_content_publication_projection_v2.sql, use only forward-only
  CREATE OR REPLACE function definitions to supersede 2252 projection digest,
  validation, and binding behavior with the exact source-complete 27-field
  projection and 8-field artifact contract at source head
  38156528c1c022a0575db71426ce2cc8f2e20ab8. Update all five existing
  valid_approved_publication_projection call sites, retain fail-closed
  composite scope and immutable P20 evidence binding, and prove the successor
  with native PostgreSQL accept/reject probes. Do not edit, rewrite, or amend
  migration 2252.
proposed_symbols_routes_keys_or_dependencies:
  - >-
    F02 allocates exactly
    packages/db/migrations/2253_v21_content_publication_projection_v2.sql;
    2252_v21_content_publication.sql remains byte-identical at SHA-256
    7981b9cf9805ec9bfba7005e7688034bacb90f5e730d0e593c43202c68afeafc.
  - >-
    The exact top-level projection key order is accountKey, productKey,
    contentId, contentVersionId, contentVersionDigest, sourceId, sourceSha256,
    sourceObjectVersionId, participantSetVersion, participantSnapshotDigest,
    participantReviewState, unresolvedParticipantCount,
    requiredRedactionCount, completedRedactionCount, redactionReviewDigest,
    title, englishTranscriptText, classTopic, mishnahReferences, occurredAt,
    durationMs, approvedByAdminId, approvedAt, artifacts,
    approvedArtifactSetDigest, sourceEvidenceDigest, projectionDigest.
  - >-
    Each artifact has exactly eight keys in this order: artifactId, kind,
    revision, payloadDigest, model, operationVersion, promptVersion,
    schemaVersion. Canonical artifact kind order remains captions,
    compressed_video, knowledge_artifact, review_material, transcript, trim,
    worksheet; the four pinned metadata fields are nonblank strings or
    explicit JSON null, never missing.
  - >-
    CREATE OR REPLACE onetime.approved_publication_projection_digest so it
    serializes the first 26 projection fields in the stated order, excludes
    projectionDigest, preserves array order without jsonb-added whitespace,
    preserves explicit JSON null for artifact metadata, and returns the exact
    lowercase SHA-256 used by the TypeScript JSON.stringify implementation.
  - >-
    CREATE OR REPLACE onetime.valid_approved_publication_projection with an
    expected_content_id argument and exact-key validation. Require exact
    account/product/content/version binding, lowercase SHA-256 evidence,
    complete participant review, zero unresolved participants, completed
    redactions equal required redactions, positive integral duration,
    canonical timestamps with approvedAt not before occurredAt, unique
    nonblank Mishnah references, exact artifact order/keys/revisions/digests,
    exact recomputed projectionDigest, and matching persisted P20
    version/source/participant/artifact metadata.
  - >-
    Update exactly the five validator invocations inherited from 2252: both
    calls in onetime.bind_content_publication_projection, the
    content_publication_outbox guard, the student_content_assignments guard,
    and the student_library_projections guard. Each call passes the row's exact
    content_id in addition to account_key, product_key, and content_version_id.
  - >-
    CREATE OR REPLACE onetime.bind_content_publication_projection so the
    publication record seed remains exactly bound to evidence contentId,
    contentVersionId, contentVersionDigest, participant set/snapshot/review and
    redaction fields, title, English transcript, class topic, Mishnah
    references, occurredAt, and durationMs. Preserve existing provider
    operation, generation, request-hash, and projection immutability fences.
  - >-
    Add native PostgreSQL probes that accept one exact source-complete 27/8
    projection and exact replay; reject the legacy 13/4 shape, missing versus
    explicit-null metadata, extra or missing keys, reordered artifacts,
    tampered digests, cross-scope/content/version evidence, mismatched seed,
    stale artifact revisions, and mismatched persisted P20 metadata. Verify all
    five downstream guards reject mismatched evidence.
