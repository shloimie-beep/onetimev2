conflicts_or_risks:
  - >-
    Do not edit or amend 2252, reuse request ID P21-MIGRATION-002, allocate any
    ordinal other than 2253, or combine unrelated schema work into the
    successor.
  - >-
    jsonb textual output can add array whitespace or collapse missing and JSON
    null; native probes must prove byte-for-byte digest parity with the
    TypeScript JSON.stringify contract.
  - >-
    Do not weaken composite account/product/content/version isolation,
    immutable approval evidence, provider-operation fencing, request hashes,
    publication generations, or rollback behavior.
  - >-
    Do not apply the migration, backfill rows, invoke a provider, deploy, send,
    publish, or claim candidate readiness from this request checkpoint.
