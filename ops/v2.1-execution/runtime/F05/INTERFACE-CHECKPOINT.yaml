compatibility_invariants:
  - API scope and actor identity are server-derived; command envelopes carry stable idempotency keys, canonical request hashes, and expected versions.
  - Public route paths reject query strings and fields that imply PII, credentials, or bearer material.
  - One logical external effect keeps one idempotency key and request hash across bounded retries and recovery generations.
  - A worker lease lasts five minutes, heartbeats every 60 seconds, and fences completion by job, owner, generation, expiry, and expected version.
  - Each recovery generation permits at most eight dispatch attempts; retry uses full jitter through the exact 30-minute exponential cap while provider Retry-After remains an additional not-before constraint.
  - Timeout or ambiguous acknowledgment enters acceptance_unknown and disables mutating retry until canonical readback proves accepted, absent-and-safe, or permanently rejected.
  - Dead-letter recovery is Admin-authorized, increments recovery generation, resets only per-generation counters, and preserves lifetime history and logical identity.
  - Compensation is a separate idempotent ProviderOperation referencing the proven accepted original operation.
  - Local mutation, command replay record, and outbox intents commit in one database transaction; the web process performs no runtime schema creation.
  - Database activation and central registration remain gated by F05-MIGRATION-001 and F05-REGISTRATION-001.
