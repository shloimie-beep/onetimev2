rationale: >-
  P33 owns registration-neutral operations modules but cannot edit the central
  web or worker composers or root package barrels.
desired_semantic_change: >-
  Mount the protected operations router with authorizeAdmin derived only from
  the current server session and returning the typed exact Admin principal,
  register the worker heartbeat publisher in the central worker lifecycle, and
  export the v2.1 observability root without weakening any existing session,
  CSRF, rate-limit, or trace boundary.
proposed_symbols_routes_keys_or_dependencies:
  - packages/observability/v21/index.ts is directly importable; any root barrel export must preserve semantic contract version 1.0.0.
  - apps/web central composer mounts createOperationsDiagnosticsRouter below an internal Admin/Ops-only path and supplies authorizeAdmin from canonical server session readback.
  - authorizeAdmin returns authorized only for source=server_session, role=admin, current=true, and exact safe principal/account/product/session IDs; request headers and bodies never assert any field.
  - Anonymous, Parent, Student, stale Admin, and client-asserted role failures remain concealed as 404 and invoke no health observer.
  - apps/worker central lifecycle calls publishOperationsHeartbeat only after exact startup identity validation.
  - heartbeat persistence or transport must retain only safe identity hashes, state, readiness codes, time, tier, and verification environment.
compatibility_assumptions:
  - Web and worker use the same immutable application_source_sha and the role-specific candidate artifact digest.
  - Existing session middleware supplies the Admin/Ops decision; request bodies and headers cannot assert the role.
  - Central registration does not grant provider, database-mutation, retry, or deployment authority.
verification_performed:
  - npm run typecheck
  - 19 focused runtime identity, health, leakage, protected-router, and heartbeat assertions
conflicts_or_risks:
  - Never mount the diagnostics router on a public health/readiness path.
  - Never publish raw exceptions, headers, cookies, bearer material, provider URLs, or PII in a heartbeat.
contains_secret_or_private_data: false
