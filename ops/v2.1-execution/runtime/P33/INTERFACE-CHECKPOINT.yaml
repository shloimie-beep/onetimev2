compatibility_invariants:
  - Runtime tier and verification environment are mandatory, separate, and fail closed when unknown or mismatched.
  - The exact web and worker identities must agree with one candidate on repository, application source, release, artifact, configuration, migration inventory, provider registry, runtime tier, and verification environment.
  - Migration inventory is forward-only; unknown ordinals, duplicate ordinals, missing expected entries, checksum or name drift, and failed read-only verification are Sev1.
  - Queue observations preserve acceptance-unknown, dead-letter, expired-lease, and duplicate-effect-risk states; duplicate-effect risk is Sev1.
  - Provider status is truthful for Resend, GHL, Stripe, Zoom, Vimeo, Drive, and Telegram; absent or not-configured status is never replaced by a fabricated ready state.
  - Diagnostics and alerts contain safe identifiers, digests, counts, timestamps, and environment identity only; secret, bearer, PII, card, database URL, Zoom/Vimeo/Drive URL leakage is Sev1.
  - Operations HTTP diagnostics are protected, private no-store, noindex, and return a fixed safe failure envelope without raw exception material.
  - Central route registration, configuration, deployment, dependency, package, migration, and shared composer changes remain gated by P33 steward requests.
