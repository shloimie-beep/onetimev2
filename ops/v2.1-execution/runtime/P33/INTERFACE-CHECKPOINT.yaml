compatibility_invariants:
  - Runtime tier and verification environment are mandatory, separate, and fail closed when unknown or mismatched.
  - Candidate configuration declares exact runtime, queue, worker, and seven-provider inventories; missing, duplicate, extra, malformed, stale, or unqualified evidence is Sev1 and never ready.
  - Every declared runtime ID and role uses its candidate artifact expectation; no runtime role may compare an artifact value to itself.
  - Migration inventory is nonempty when required, structurally valid, forward-only, qualified and fresh, and its deterministic digest equals the exact candidate migration digest.
  - Queue observations preserve acceptance-unknown, dead-letter, expired-lease, and duplicate-effect-risk states; duplicate-effect risk is Sev1.
  - Provider status is truthful for Resend, GHL, Stripe, Zoom, Vimeo, Drive, and Telegram; absent or not-configured status is never replaced by a fabricated ready state.
  - Diagnostics and alerts use allowlisted schemas and safe identifiers; credential-shaped keys, Basic/Bearer/JWT material, secret hashes, signed URLs, PII, cards, database URLs, provider URLs, and secret-bearing context or errors are prohibited.
  - Runtime identity, health, and alert endpoints redact and scan their exact serialized final bodies; any source or final-body finding emits only a fixed safe 503 body.
  - Operations HTTP diagnostics require a typed, current, server-session-derived exact Admin principal; anonymous, Parent, Student, stale, and client-asserted roles are concealed without invoking observers.
  - Worker heartbeat readiness is derived only from the validated health snapshot and cannot be asserted by a caller.
  - Central route registration, configuration, deployment, dependency, package, migration, and shared composer changes remain gated by P33 steward requests.
