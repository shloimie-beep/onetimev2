compatibility_invariants:
  - Public intake classifications are exactly family and school and are mutually exclusive.
  - This P08 export preserves only the family|school branch seam; School command and form details are P09-owned and are not exported here.
  - The Family form contains adult identity, exact password confirmation, editable searchable IANA timezone, required legal acceptance, and separate optional general-marketing and Parent-newsletter choices; it never contains card, Student, guardian, recording, recognition, reminder, phone, or country fields.
  - Browser timezone is suggestion-only, remains editable, and the server rejects non-IANA identifiers and raw offsets.
  - Optional adult consent checkboxes are separate and never preselected or inferred; their exact booleans are canonicalized, persisted, and carried by the quarantinable outbox.
  - The fixed expiry is exactly 2026-09-13T19:24:00+03:00, represented canonically as 2026-09-13T16:24:00.000Z.
  - Before expiry, Family signup creates immediate cardless free access with no setup-email dependency; at or after expiry it persists inactive access and offers hosted Checkout only when GHL identity state is not identity_review.
  - At or after expiry, identity_review yields inactive_identity_review with checkout_required false, a visible identity-review next action, and quarantined GHL sync/workflow and paid billing pending Admin resolution.
  - Any existing local HumanAccount identity or Family household lifecycle returns the same generic sign-in-or-reset result with zero household, access, credential, outbox, or session writes; creating another household for an existing account is a separate authenticated operation.
  - A GHL-only CRM match does not count as local account existence and may create a fresh local signup while reusing the verified adult CRM contact.
  - Public signup requires a 43-128 character high-entropy idempotency key, but the key is never authentication or authorization material.
  - The server canonicalizes semantic name, normalized email, validated IANA timezone, legal acceptance, exact optional consent choices, and keyed password fingerprint and computes the canonical request digest; password confirmation is verified but never persisted and caller-supplied request hashes are rejected.
  - Request locking, local identity and household reads, GHL evidence, recovery receipts, commits, and outbox intents bind to the exact validated scope and public_family_signup operation.
  - Recovery succeeds only for an exact scope, operation, key, and canonical request digest match; changed fields and cross-scope replay fail closed without returning prior projection identifiers or email.
  - Local identity, account, household, credential, access, idempotency, and outbox state commit before any provider effect.
  - Provider failure never rolls back a committed signup; recovery reuses the stable idempotency key and durable outbox.
  - Fresh signup grants no rolling trial, completes no provider effect inline, and never creates Student GHL contacts.
