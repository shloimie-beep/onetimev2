compatibility_invariants:
  - A Student principal is bound to exactly one Student identity and one household by authenticated server context; neither a request body nor a route parameter selects the self record.
  - The repository port accepts only the authenticated Student and household identifiers together; profile projection fails closed on sibling, cross-household, relationship, archived-state, or inactive-access drift.
  - Student profile and account outputs contain own actual/display name and username only; no email, age, billing, adult CRM, sibling data, current password, or credential mutation is exported.
  - Student credentials are Parent/Admin managed, existing passwords are never displayed, and Student account controls provide help plus idempotent session logout only.
  - Today, Calendar, Class, Library, Progress, Questions, Updates, Notifications, Support, and Account routes are closed canonical Student routes; Parent/Admin and malformed paths are denied.
  - Privacy and data-rights navigation/routes exist only for a self Student with verified adult-owner identity; they are absent and denied for dependent Students.
  - Join output contains only an opaque internal Student-class action and occurrence identity; provider IDs, raw provider URLs, and browser bearers are absent.
  - Inactive household access and archived Student state are denied before protected data projection; free, active, and grace retain normal Student capability.
