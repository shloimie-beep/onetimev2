rationale: >-
  The immutable predecessor request would create competing P22 attendance and
  consent authorities and lacks runtime-tier and verification-environment
  isolation. The corrected schema contract instead limits P22 persistence to
  its engagement projections and append-only evidence.
desired_semantic_change: >-
  Allocate the next safe forward-only migration only after steward review.
  Bind the migration to exact schema contract identity
  P22-LEARNING-ENGAGEMENT-SCHEMA-002.
  Create four-dimension-fenced P22 question projection, append-only question
  transition ledger, append-only recognition ledger, announcements,
  announcement reads, and review completions. Enforce scoped idempotency
  request hashes, optimistic versions, ledger UPDATE/DELETE rejection, unique
  first qualification, immutable monotonic recognition sequence,
  roster-verified audience_class_key for direct targets, and an append-only
  learning_review_completions event ledger with action, source, audit,
  publication proof, monotonic append sequence, authenticated-Student completion,
  and reasoned assigned-Admin revoke/restore evidence. Reject UPDATE/DELETE and
  derive effective completion from the latest append sequence. Use
  transaction-compatible keys. Add the exact-scope
  onetime.learning_badge_award_projection as the seventh P22 table, unique by
  scoped Student, class, family, and level, with deterministic source digest,
  version, award/revoked state, qualifying count/source keys, recalculated_at,
  immutable rule version, per-family source digest/audit references, awarded_at,
  revoked_at, and nullable correction audit reference. Initial under-threshold
  rows are unawarded. Ordinary recalculation cannot revoke an award. Only an
  explicit reasoned Admin correction with correction_audit_ref,
  correction_reason, and corrected_by_admin_id may revoke or restore it.
  Exact recalculation replay writes nothing;
  changed canonical evidence atomically updates the projection without
  deleting source events. Explicitly create no
  attendance event, attendance projection, attendance segment, consent,
  identity, actual-name, display-name, or leaderboard-learner table. Preserve
  migration 2251 as the sole attendance write authority.
proposed_symbols_routes_keys_or_dependencies:
  - onetime.learning_question_projection
  - onetime.learning_question_transition_ledger
  - onetime.learning_question_recognition_ledger
  - onetime.learning_announcements
  - onetime.learning_announcement_reads
  - onetime.learning_review_completions
  - onetime.learning_badge_award_projection
  - account_key + product_key + runtime_tier + verification_environment_id fences
  - append-only transition, recognition, and review-completion ledger triggers
  - deterministic transition_event_id, recognition_event_id, and review_event_id
  - badge correction_audit_ref + correction_reason + corrected_by_admin_id state guards
  - P22-LEARNING-ENGAGEMENT-SCHEMA-002
compatibility_assumptions:
  - P18 migration 2251 remains the only attendance event/projection writer.
  - Canonical privacy consent and P12 identity remain external read-only seams.
  - >-
    Migration 2254 creates no view, foreign key, trigger, index, or other
    database object that references actual_name or display_name changes
    introduced later by P12 migration 2255.
  - F02 chooses the ordinal and authors SQL; P22 allocates no ordinal.
verification_performed:
  - Verified P22-LEARNING-ENGAGEMENT-SCHEMA-002 excludes P22 attendance, consent, and name tables.
  - Verified repository DML targets only the seven requested P22-owned structures.
  - Verified focused transaction tests cover replay, conflict, stale rollback, and ledger append order.
conflicts_or_risks:
  - Withhold the immutable predecessor request; it is evidence only and must remain byte-identical.
  - Reject any migration draft containing P22 attendance, consent, identity, or name persistence.
contains_secret_or_private_data: false
