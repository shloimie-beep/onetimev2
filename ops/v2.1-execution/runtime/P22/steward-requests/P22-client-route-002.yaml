rationale: >-
  Existing Admin and Student learning views are outside the current write
  ceiling and require stewarded authenticated route composition.
desired_semantic_change: >-
  Register the existing Admin and Student learning views in the authenticated
  application shell. Bind leaderboard rows to the new opaque entryKey. During
  compatibility transition, treat retained LeaderboardEntry.studentId as the
  same opaque full-scope entry key, never as a canonical peer Student ID.
  Render only the server-provided safe displayName label.
proposed_symbols_routes_keys_or_dependencies:
  - AdminLearningWorkspace authenticated route
  - StudentLearningOverview authenticated route
  - LeaderboardEntry.entryKey
  - opaque compatibility LeaderboardEntry.studentId
compatibility_assumptions:
  - The client never receives canonical peer Student IDs or actual names.
  - Self is labelled You and peer labels are already consent-safe server projections.
verification_performed:
  - Verified corrected contract provides entryKey and opaque compatibility studentId.
  - Verified displayName remains the safe rendered label consumed by the existing client.
conflicts_or_risks:
  - Do not key client actions or analytics to a canonical peer Student ID.
contains_secret_or_private_data: false
