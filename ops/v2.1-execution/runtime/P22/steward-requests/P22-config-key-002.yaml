rationale: >-
  Stable consent-safe aliases and opaque leaderboard entry keys require a
  protected server-side HMAC key.
desired_semantic_change: >-
  Add the required server-only configuration key
  LEARNING_ALIAS_HMAC_KEY. Validate that it is present and nonblank in every
  enabled runtime. Inject it into the P22 service without logging, returning,
  serializing, or exposing its value to clients.
proposed_symbols_routes_keys_or_dependencies:
  - LEARNING_ALIAS_HMAC_KEY
compatibility_assumptions:
  - Rotation policy must preserve the intended alias-stability window or explicitly version aliases.
  - The request names only the configuration key and contains no secret value.
verification_performed:
  - Verified source accepts aliasHmacKey only through server-side service construction.
  - Verified aliases use HMAC-SHA256 over length-prefixed complete scope.
conflicts_or_risks:
  - Never place the secret value in code, commits, logs, responses, evidence, or client configuration.
contains_secret_or_private_data: false
