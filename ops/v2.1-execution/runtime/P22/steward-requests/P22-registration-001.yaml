rationale: >-
  P22 cannot edit root barrels or central client/server composers. Its additive
  contract, repository, domain, server, and role-view modules remain directly
  importable until I36 performs governed registration.
desired_semantic_change: >-
  Export the P22 roots and mount authenticated Admin and Student learning routes.
  Derive every actor, household, Student, and class field from the integrated
  F03/F04/P16 session and enrollment seams; never accept scope from request
  bodies. Keep private question routes absent and denied for Parents.
proposed_symbols_routes_keys_or_dependencies:
  - export packages/contracts/src/learning/index.ts
  - export packages/domain/src/learning/engagement.ts
  - export packages/db/src/learning/repository.ts and schema-contract.ts
  - register createLearningEngagementService using a server-only alias HMAC secret
  - mount Student question, update, badge, attendance-summary, and authenticated class-board routes
  - mount Admin question moderation, announcement, attendance correction, and full-name board routes
  - do not mount Parent private-question or public leaderboard routes
compatibility_assumptions:
  - F03 supplies authenticated principal identity and CSRF protection.
  - F04 supplies household/Student authorization; P16 supplies enrolled class scope.
  - Recognition consent is read from the governed privacy seam and defaults off when absent.
verification_performed:
  - focused P22 positive, denial, isolation, idempotency, correction, and consent tests
  - npm run typecheck
  - focused ESLint, Prettier, diff, and secret checks
conflicts_or_risks:
  - Never log private question/answer text or the alias HMAC secret.
  - Do not introduce Student peer chat, GHL contact creation, points, currency, or redeemable rewards.
  - Do not expose a route that can render a board without authenticated class scope.
contains_secret_or_private_data: false
