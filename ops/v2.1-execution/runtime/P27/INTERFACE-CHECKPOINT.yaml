compatibility_invariants:
  - The contract accepts Adult subjects only; Student input is rejected before repository access, intent creation, or provider invocation.
  - A verified contact link wins, then one exact normalized-email match; disagreement or multiple matches enters visible review quarantine with zero provider intents.
  - Name and phone are never matching or merge keys, and active household membership alone never classifies an Adult as active legacy.
  - Adult classification is exactly active_legacy, former_canceled, opted_in_lead, suppressed, or review, with suppression taking precedence.
  - One Adult contact may project multiple household-keyed records, and every projection preserves household lifecycle, access, and applicable Stripe reference boundaries.
  - The complete local plan and household projection commit before provider synchronization; later provider failure cannot roll back the local result.
  - Provider desired-state construction is pure, review plans emit no mutation intent, and live provider authority remains absent.
  - Persistence is parameterized and migration-only; P27 requests F02 migration authority and I36 registration without editing central hotspots.
