compatibility_invariants:
  - App upload and registered private Drive intake create one account/product-scoped ContentSource identity from the full streamed SHA-256; filenames and provider references are provenance only.
  - Only OBS MP4, MOV, or MKV originals from 1 byte through 5 GiB are accepted; originals remain preserved and never use a filename-derived managed object key.
  - Multipart transfer uses 64 MiB parts except the final part, at most four concurrent parts, 15-minute part authorization, and a 24-hour incomplete-upload abort boundary; provider ETags are never content checksums.
  - Confirmation requires exact agreement among the durable source/session, private versioned eu-central-1 SSE-KMS object readback, and independently read recovery-journal receipt.
  - Drive inventory paginates to completion, remains inside the registered incoming folder, requires unchanged nonzero size plus change marker for at least 120 seconds, and streams bounded ranges through the same managed-object contract.
  - Content lifecycle transitions are received to validating to processing to needs_review to approved to publishing to published, with exact failed_from recovery, governed archive transitions, bounded retry/dead-letter state, and no Student visibility before published.
  - Occurrence association is an explicit Admin confirmation over account/product-scoped P16 occurrence identity; date, time, and filename signals are hints rather than authority.
  - Commands are Admin-, tenant-, product-, version-, and request-hash-fenced; replay is idempotent and conflicting reuse fails without a write.
