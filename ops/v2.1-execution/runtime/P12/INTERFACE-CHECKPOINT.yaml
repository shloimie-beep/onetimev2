compatibility_invariants:
  - Parent authority is derived from a server-authenticated parent principal and exact adult-owned household scope.
  - Standard Family creation and restoration cannot exceed three active Students even if repository data carries a larger allowance, and must commit against the exact household revision.
  - Same-state archive and restore resubmits fail closed with parent_student_lifecycle_unchanged before replacement, revision increment, audit creation, enrollment/session effects, or repository commit.
  - A Student is self or dependent, has active or archived lifecycle, and never carries email, age, date-of-birth, grade, or Hebrew-specific fields.
  - Credential creation/reset returns plaintext only in the immediate display-once handoff; persistence receives only a hash.
  - Username or password changes and archive transitions revoke Student sessions; active lifecycle drives canonical enrollment.
  - Inactive household access retains a scoped overview but cannot mutate Students.
  - Central routes and root barrel exports remain gated by P12-registration-001.
