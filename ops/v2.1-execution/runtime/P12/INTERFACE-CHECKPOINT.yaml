compatibility_invariants:
  - Parent authority, adult identity, active role, session, and exact owned household are derived only from the authenticated server session; request input cannot select scope.
  - An inactive household receives a status-only overview with no Student rows, forms, handoff, or mutation replay; every Student mutation fails closed.
  - Standard Family creation and restoration enforce at most three active Students under a locked household revision, including concurrent final-seat attempts.
  - Student identity stores required Unicode-nonblank actual_name, optional Unicode-nonblank display_name, and relationship self or dependent without date, age, grade, Hebrew-specific, email, or provider identity fields.
  - Usernames are globally unique within exact runtime scope; credentials persist only as the canonical versioned Argon2id hash and credential-version change invalidates prior Student authentication.
  - Persisted idempotency evidence uses a server-keyed password fingerprint rather than plaintext-derived request hashing; exact replay writes nothing and returns credential_handoff null even after later state changes.
  - Only a newly committed create or credential reset may display the submitted password once; plaintext never crosses persistence, audit, logs, email, or a replay response.
  - Student profile, household revision, service acceptance, canonical enrollment, audit, credential evidence, launch/session revocation, revocation readback, and receipt changes share one transaction.
  - Immutable P12-registration-001 is superseded and must never be edited or applied; central server, client-route, and barrel composition remain gated by the three schema-valid -002 successor requests.
