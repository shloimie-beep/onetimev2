rationale: >-
  P12 owns corrected contract, domain, server-feature, and client-feature index
  modules, while their central package and application barrels are steward-owned.
  This request supersedes immutable P12-barrel-export-002 because its semantic
  interface binding predates the lazy credential-hash repository contract.
desired_semantic_change: >-
  Supersede immutable P12-barrel-export-002 and never edit or apply that stale
  predecessor. Re-export the semantic 1.2.0 Parent-household contract and its
  domain functions from the canonical contract/domain portal roots, and
  re-export the concrete client API/workspace and server repository/service/router
  from the appropriate application feature roots. Preserve symbol semantics and
  do not restore predecessor contract aliases, legacy Student fields, an in-memory
  production repository, an eager password-hash input, or a plaintext credential
  persistence surface.
proposed_symbols_routes_keys_or_dependencies:
  - PARENT_HOUSEHOLD_CONTRACT_VERSION 1.2.0 contract root
  - ParentHouseholdRepository with lazy async password_hash_factory
  - Parent household domain aggregate and ParentHouseholdError
  - createPostgresParentHouseholdRepository
  - createParentHouseholdService
  - createParentHouseholdRouter
  - createParentHouseholdApi
  - ParentHouseholdWorkspace
