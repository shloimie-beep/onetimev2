rationale: >-
  P12 owns the concrete Parent household workspace and same-origin client API,
  but the Parent application shell and route registry are steward-owned.
desired_semantic_change: >-
  Supersede immutable P12-registration-001, raw SHA-256
  501ae46b1ad26e933d2e15b4f13760f4c3c8ec93d2672dc7be0d7e372046e733;
  never edit that predecessor. Register ParentHouseholdWorkspace at
  /app/parent and /app/parent/students with overview view, at
  /app/parent/students/new with create view, and at
  /app/parent/students/:studentId with the path-bound student view. Bind the
  workspace to createParentHouseholdApi and its /api/app/parent bootstrap and
  mutation routes. Preserve same-origin credentials, no-store reads,
  server-provided CSRF, and a fresh high-entropy idempotency key per user
  mutation. Inactive access renders the scoped overview and disables all
  Student routes, rows, forms, credential handoffs, and management controls; it
  must not gain a fallback route or mutation bypass.
  Render actual name, optional display name, relationship, username, lifecycle,
  and display-once credential forms only. Remove or reject every legacy
  date-of-birth, age, age-band, grade, Hebrew-specific-name, Student-email, and
  provider-identity fallback.
proposed_symbols_routes_keys_or_dependencies:
  - ParentHouseholdWorkspace
  - ParentHouseholdView
  - createParentHouseholdApi
  - /app/parent
  - /app/parent/students
  - /app/parent/students/new
  - /app/parent/students/:studentId
  - /api/app/parent same-origin bootstrap and mutation API
compatibility_assumptions:
  - The authenticated Parent shell protects each route and does not synthesize household or adult scope client-side.
  - The server snapshot is authoritative for access state, revision, active count, seat availability, and Student lifecycle.
  - Credential handoff is transient UI state and is never restored from cache, URL, analytics, or a replayed response.
verification_performed:
  - Workspace render tests covered overview, self/dependent actual-name instructions, create/edit/lifecycle/reset forms, inactive access, and the hard seat cap.
  - Client API tests covered same-origin/no-store bootstrap, CSRF, idempotency, canonical request bodies, and canonical route paths.
  - Router tests rejected client-selected scope and legacy Student fields.
conflicts_or_risks:
  - Do not edit, re-admit, or implement P12-registration-001; this schema-valid request supersedes it.
  - Do not serialize the credential handoff into persistent client storage or analytics.
  - Do not expose management controls when can_manage_students is false.
contains_secret_or_private_data: false
