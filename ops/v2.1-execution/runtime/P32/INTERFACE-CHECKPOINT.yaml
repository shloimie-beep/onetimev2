compatibility_invariants:
  - Consent is exact-Student and exact-scope; a dependent Student is represented only by the current account owner, while recording and recognition choices for a self Student require the exact linked adult Student identity.
  - Service-account, recording-participation, and member-recognition consent remain independent; withdrawal changes only its scope, later recorded joins require current service and recording grants, and protected playback is authorized independently.
  - RecordingParticipantSnapshot is frozen from exact occurrence-start roster, relationship, consent event, notice, and lifecycle-version evidence and is never rewritten by later identity or consent changes.
  - Parent and adult-self Student privacy requests require recent-password reauthentication and exact actor/subject scope; dependent Students have no self-service route and dependent requests require separate privacy Admin review.
  - Parent requests for a Student are limited to relationship=dependent in the exact owned household; a self Student uses the matching adult-self Student context.
  - Requester-visible status is exactly requested, processing, completed, partially_excepted, failed, or null for canceled; provider-pending uncertainty cannot become failed without canonical noncompletion proof and no unknown effect.
  - Closure and erasure are distinct request kinds; a completed export grant is hash-only, initiating-session-bound, one-use, and expires exactly 15 minutes after issue.
  - Ordinary Parent exports exclude recordings/library/playback plus private question, Rabbi answer, Student support, notification, and comparison bodies.
  - Shared-media treatment restricts immediately, preserves other participants, and requires exact subject redaction, every derivative/search invalidation, human approval, and provider readback before republish.
  - Recognition consent changes only attribution; rank and learning facts remain, while nonconsented peers receive a stable class-scoped nonidentifying alias.
  - Purge records contain only HMAC identifiers, hashes, policy/config/release metadata, tombstones, legal holds, scope, sequence, and provider outcomes; deleted content and raw identifiers are forbidden.
  - Primary deletion waits for checksum-verified Object-Lock primary and replica readback; restore traffic remains closed until the full chain is replayed, negative queries pass, provider effects are disabled, and no provider recreation is pending.
  - Database migration, central barrels/routes/workers, and independent purge-ledger infrastructure remain gated by P32-migration-001, P32-registration-001, and P32-config-001.
