compatibility_invariants:
  - The canonical active class series is Sunday through Thursday at 19:00 Asia/Jerusalem for 60 minutes; generation covers at least 90 local days and excludes Friday/Saturday starts.
  - Occurrence identity is stable and idempotent as series id plus canonical Jerusalem local class date.
  - Local recurrence is converted through an explicit IANA time zone; DST gaps and unselected folds fail closed, and display formatting never falls back to the browser time zone.
  - Parent and Student display zones are server-derived preferences; only Admin may request an alternate explicit display zone.
  - Calendar role views are closed vocabularies; inactive access and out-of-scope household/Student filters are denied before a result is returned.
  - Parent results never contain Join actions; Student results expose only the opaque open_live_class action during the ten-minute-before through fifteen-minute-after window.
  - Past occurrences are immutable, edits require the exact series version, and this-and-future edits split history from a versioned successor series.
  - Dates are formatted with en-US-u-ca-gregory, and no Google Calendar/provider contract or action is exported.
