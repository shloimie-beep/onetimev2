compatibility_invariants:
  - Aggregate kinds and states are closed vocabularies for human account, Student, access, class occurrence, content, Student question, support, and billing provider operation.
  - Product scope is always one_time_mishnayos; verification environments map deterministically to isolated_staging or production and cannot cross runtime tiers.
  - Mutations require a nonempty opaque aggregate/actor identity, explicit authorization, a stable idempotency key, a lowercase SHA-256 canonical request hash, and an exact expected version.
  - Exact replays return the prior committed result; same-key request drift fails as an idempotency conflict; stale versions produce no write.
  - Content failure recovery returns only to failed_from, access changes require an exact canonical cause, and terminal states have no unlisted escape.
  - Billing provider-operation completion is fenced by the current worker generation; acceptance_unknown is quarantined until canonical reconciliation proves the next state; bounded retry and governed dead-letter recovery preserve the logical key/hash.
  - Migration ordinal 2234 is the first v2.1 allocation, 2231 remains unallocated, and the next available ordinal is 2235.
