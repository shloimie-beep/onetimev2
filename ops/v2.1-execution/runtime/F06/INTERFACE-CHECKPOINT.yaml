compatibility_invariants:
  - ProviderOperation extends the integrated F05 fenced job contract and retains one stable idempotency key and canonical request hash across retry, readback, and recovery.
  - Every operation and readback binds the exact active registry key, protected provider-account reference, product, runtime tier, verification environment, operation type, and request hash.
  - Stripe bindings prohibit mutation; One Time may ingest verified signed events and read canonical financial truth but never create or mutate financial objects.
  - Acceptance-unknown operations are readback-only until canonical proof establishes accepted/current, absent-and-retry-safe, permanently rejected, or still unknown.
  - A verified GHL link wins, then exact normalized-email match; disagreement or multiple matches enters identity_review and name or phone is never a merge key.
  - Identity review blocks only GHL contact/projection/workflow/billing effects; local login, valid free access, local Student work, and Resend security remain independently available.
  - One adult GHL contact may own multiple household-keyed records, while GHL household records and Stripe Customers remain distinct per household and contact suppression remains adult-scoped.
  - Ownership transfer starts only after the F04 local transfer commits, preserves household and financial references, and completes provider reassociation only after exact readback.
  - Persistence is migration-only and parameterized; F06 requests F02 migration authority and I36 registration without editing central hotspots.
