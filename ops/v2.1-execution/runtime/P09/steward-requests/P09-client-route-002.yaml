  - schoolInquiryFormModel
  - exactly four required and two optional School-inquiry fields
  - existing strict POST /api/v2.1/signup/school-inquiry route
compatibility_assumptions:
  - P08 supplies the mutually exclusive family or school public classification seam.
  - The server remains authoritative for validation, normalization, deduplication, and durable acknowledgment.
  - Ordinary Parent and Student account journeys remain separate and unchanged.
verification_performed:
  - Verified schoolInquiryFormModel exposes exactly four required and two optional fields.
  - Verified the model copy describes manual follow-up without promising access or acceptance.
  - Verified the model exposes no authentication, account, role, portal, roster, consent, or provider action.
conflicts_or_risks:
  - Do not infer School inquiry from missing or hybrid classification.
  - Do not add hidden account, access, role, portal, credential, consent, or marketing fields.
  - Do not register an authenticated School application surface.
