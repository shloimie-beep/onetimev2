rationale: >-
  P09 owns the pure signed-out School-inquiry form model but cannot edit the
  public client route registry or application shell that renders it.
desired_semantic_change: >-
  Register signed-out GET /school from schoolInquiryFormModel with the approved
  School-inquiry copy and exactly four required fields and two optional fields.
  Keep the page a manual-follow-up inquiry only: it must not require
  authentication, create product access or an account, offer credentials,
  imply acceptance, expose a School role or portal, enroll nurture, render a
  roster surface, or trigger a provider effect. Submit only to the existing
  strict same-origin public School-inquiry POST route.
proposed_symbols_routes_keys_or_dependencies:
