forbidden_for_feature_tasks:
- applied migration edits
- new migration files outside F02
- central server/client/worker composer edits after F01 interface checkpoint
- root contract/domain barrel edits
- package manifests/lockfiles
- global styles/design tokens outside F07
- canonical GHL registry outside P28/I36
- global control/merge ledgers
- another task's runtime or evidence files
