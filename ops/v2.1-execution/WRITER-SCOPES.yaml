schema_version: 1
rule: An active writer may change only its machine-normalized owned globs and its own runtime/evidence files. Prose
  scope notes never grant write authority. Shared hotspots require an exact canonical-slot lease from C00; any newly
  discovered path outside the normalized set requires a steward request before editing.
lease_semantics: Task writer_slots are capabilities, not task-duration claims. READY-QUEUE grants only the exact
  canonical slots needed for the current checkpoint; I36 must not overlap an unreleased feature/steward lease.
central_slots:
- slot: AUTHORITY
  owner_sequence:
  - C00
  paths:
  - AGENTS.md authority/status
  - ops/v2.1-execution/control/**
- slot: SERVER_COMPOSER
  owner_sequence:
  - F01
  - I36
  paths:
  - apps/web/src/server/app.ts
  - apps/web/src/server/index.ts
- slot: CLIENT_COMPOSER
  owner_sequence:
  - F01
  - I36
  paths:
  - apps/web/src/client/app/crm-entry.tsx
  - apps/web/src/client/app/portal-entry.tsx
  - apps/web/src/client/app/live-entry.tsx
  - Vite entry/config registration
- slot: WORKER_COMPOSER
  owner_sequence:
  - F01
  - I36
  paths:
  - apps/worker/src/main/index.ts
- slot: MIGRATION_AUTHORITY
  owner_sequence:
  - F02
  paths:
  - packages/db/migrations/2234+*.sql
  - ops/v2.1-execution/runtime/F02/MIGRATION-ALLOCATIONS-PROPOSAL.yaml
- slot: CONFIG_DEPS
  owner_sequence:
  - F01
  - I36
  paths:
  - packages/config/src/index.ts
  - .env.example
  - package.json
  - package-lock.json
  - deploy/runtime config
- slot: BARREL_REGISTRAR
  owner_sequence:
  - F01
  - I36
  paths:
  - packages/contracts/src/index.ts
  - packages/domain/src/index.ts
  - root registries
- slot: DESIGN_SYSTEM
  owner_sequence:
  - F07
  - I36
  paths:
  - packages/brand-system/**
  - global/shared CSS
  - shared app shells/navigation
- slot: GHL_REGISTRY
  owner_sequence:
  - P28
  - I36
  paths:
  - integrations/highlevel/registry/workflow-registry.yaml
  - generated GHL registry/control reports
- slot: RELEASE_INTEGRATOR
  owner_sequence:
  - I36
  paths:
  - codex/v21-integration
  - CI/global test config
  - ops/v2.1-execution/merge/candidates/**
  - ops/v2.1-execution/results/<candidate-digest>/CANDIDATE-RESULT-INDEX.yaml
- slot: FINAL_RELEASE_AUTHORITY
  owner_sequence:
  - R45
  paths:
  - ops/v2.1-execution/merge/FINAL-RELEASE-DECISION.yaml
feature_tasks:
  F01:
