  replacement: 02-ACCEPTANCE-CONTRACT-v2.1.yaml
  status_reusable: false
  evidence_reusable_only_when: behavior, candidate, environment, identity, and expected result still match a v2.1 case
- legacy_authority: ops/goals/OT-LAUNCH-01/BOARD.yaml
  disposition: superseded
  replacement: candidate-bound result set generated from 02 and 14
  status_reusable: false
- legacy_authority: ops/audits/2026-07-26/parallel-control-tower/dependency-dag.yaml
  disposition: historical_only
  replacement: future roadmap dependency graph generated from v2.1
  status_reusable: false
