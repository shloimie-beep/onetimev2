roadmap_generation_contract:
  roadmap_may_be_generated_only_when:
  - all package documents exist and validate
  - every release-blocking requirement has one or more acceptance cases
  - every acceptance case maps to at least one normative document
  - legacy control authorities are dispositioned
  - no unresolved placeholder marker or conditional branch changes launch behavior
  every_roadmap_task_must_include:
  - task_id
  - requirement_ids
  - acceptance_case_ids
  - dependencies
  - owner_or_writer_slot
  - exact_write_scope
  - preserved_invariants
  - environment
  - external_effect_authority
  - stop_condition
  - required_evidence
  - rollback_or_recovery
  - definition_of_done
  task_completion_rule: a task is complete only when its candidate-bound acceptance cases pass; code existence alone is insufficient
  product_path_priority: historical cleanup and evidence work cannot block a functioning production journey unless it prevents
    safe production operation
orphan_checks:
  requirements_without_spec_refs: []
  requirements_without_cases: []
  cases_without_requirement: []
  documents_without_defined_role: []
  old_status_authorities_remaining: []
