problem_statement: >-
  The campaign-local provider_contact_ref_hash is SHA-256 over governed-ghl-contact-v1, exact GHL location, and raw
  provider contact ID separated by null bytes. The older adult_ghl_identity_link.verified_contact_ref_hash has no
  authoritative domain, version, location binding, provenance, or non-test producer. Direct equality between the two
  fields is therefore not proof and would mark every real provider row unproven.
required_design: >-
  Use the durable adult_household_contact_links account/product/location/raw-provider-contact binding first, compute the
  campaign hash inside PostgreSQL without selecting raw identifiers, join its canonical contact_key to onetime.contacts,
  and use unique exact normalized-email matching to the scoped active v21 adult identity as the fail-closed fallback.
  Treat the unversioned adult-link hash only as possible conflict evidence, never positive identity proof. Reject missing,
  duplicate, archived, cross-account, cross-product, cross-location, or conflicting mappings. Preserve zero writes and
  sanitized output.
